<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>E-Mail bestätigt</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: Inter, sans-serif;
        background: #f6f7fb;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }

    .box {
        background: white;
        padding: 40px 50px;
        border-radius: 20px;
        box-shadow: 0 8px 28px rgba(0,0,0,0.08);
        text-align: center;
        max-width: 420px;
    }

    h2 {
        font-weight: 700;
        color: #3a3a3a;
        margin-bottom: 10px;
    }

    p {
        font-size: 15px;
        color: #666;
        margin-bottom: 25px;
    }

    .btn {
        display: inline-block;
        padding: 12px 20px;
        background: #4a6fff;
        color: white;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
    }

    .btn:hover {
        background: #3c58d9;
    }

    .small {
        margin-top: 15px;
        font-size: 13px;
        color: #777;
    }
</style>

<!-- AUTO REDIRECT nach 5 Sekunden -->
<script>
setTimeout(() => {
    window.location.href = "/login";
}, 5000);
</script>

</head>
<body>

<div class="box">
    <h2>🎉 E-Mail bestätigt!</h2>

    <p>Dein Account wurde erfolgreich verifiziert.<br>
       Du wirst automatisch weitergeleitet.</p>

    <a href="/login" class="btn">Jetzt zum Login</a>

    <div class="small">(Weiterleitung in 5 Sekunden ...)</div>
</div>

</body>
</html>
