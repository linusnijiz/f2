<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Registrieren – lyrp.io</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #f4f5fb;
    font-family: 'Inter', sans-serif;
}

.container {
    width: 420px;
    margin: 90px auto;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.07);
}

h2 {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #ddd;
    margin-top: 14px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border-radius: 12px;
    background: linear-gradient(90deg, #7d51ff, #b56bff);
    color: white;
    font-size: 18px;
    font-weight: 600;
    border: none;
    cursor: pointer;
}

p {
    text-align: center;
    margin-top: 20px;
}

.error-box {
    background: #ffe0e0;
    padding: 12px;
    border-left: 4px solid red;
    border-radius: 6px;
    margin-bottom: 15px;
}
</style>

</head>
<body>

<div class="container">

    <h2>Konto erstellen</h2>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="email" name="email" placeholder="E-Mail-Adresse" required>

        <input type="text" name="username"
               placeholder="Benutzername"
               value="{{ request.args.get('username','') }}"
               required>

        <input type="password" name="password" placeholder="Passwort" required>

        <button type="submit">Registrieren</button>
    </form>

    <p>
        Bereits ein Konto? <a href="/login">Anmelden</a>
    </p>

</div>

</body>
</html>
