<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>E-Mail gesendet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: Inter, sans-serif;
        background: #f6f7fb;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {
        background: white;
        padding: 45px 50px;
        border-radius: 22px;
        box-shadow: 0 8px 28px rgba(0,0,0,0.08);
        text-align: center;
        max-width: 450px;
        width: 100%;
    }

    .icon {
        font-size: 48px;
        margin-bottom: 15px;
        color: #4a6fff;
    }

    h2 {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #333;
    }

    p {
        font-size: 15px;
        color: #555;
        margin-bottom: 25px;
    }

    .btn {
        padding: 12px 22px;
        background: #4a6fff;
        color: white;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        transition: 0.2s;
        display: inline-block;
    }

    .btn:hover {
        background: #3c58d9;
    }

    .small {
        margin-top: 15px;
        font-size: 13px;
        color: #999;
    }
</style>

</head>
<body>

<div class="box">
    <div class="icon">📨</div>

    <h2>Bestätige deine E-Mail</h2>

    <p>
        Wir haben dir eine Bestätigungs-E-Mail geschickt.<br>
        Bitte öffne deinen Posteingang und klicke auf den Link.
    </p>

    <a href="/login" class="btn">Zur Login-Seite</a>

    <div class="small">
        Kein Link erhalten? Überprüfe auch deinen Spam-Ordner.
    </div>
</div>

</body>
</html>
